<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>среда. — функциональный прототип v6.7</title>
  <link rel="stylesheet" href="css/style.css?v=67">
</head>
<body>
<div id="mobileSplash" class="mobile-splash"><img src="assets/logo.png" alt="среда."></div>

<div id="desktopHeader" class="desktop-header">
  <div class="desktop-header-main">
    <button class="desktop-logo" onclick="go('home')" aria-label="Главная"><img src="assets/logo.png" alt="среда."></button>
    <div class="desktop-actions">
      <button onclick="openNotifications()" aria-label="Уведомления" class="desktop-icon"><img src="assets/icons/notification-plain-v64.png" alt=""><i class="desktop-dot"></i></button>
      <button onclick="openDesktopChatsV5()" aria-label="Сообщения" class="desktop-icon desktop-chat-icon"><img src="assets/icons/messages-v6.png" alt=""><i class="desktop-dot msg-dot"></i></button>
      <button onclick="toggleAccountMenuV5()" aria-label="Профиль" class="desktop-avatar-btn">АС</button>
    </div>
  </div>
  <div id="desktopCompactNavV65" class="desktop-compact-nav-host-v65"></div>
</div>
<div id="desktopOverlayRoot"></div>

<div id="app">
  <header class="topbar">
    <button class="brand" onclick="go('home')" aria-label="Главная">
      <img src="assets/logo.png" alt="среда.">
    </button>
    <button class="top-notifications" onclick="openNotifications()" aria-label="Уведомления">
      <img class="bell-glyph bell-image-v6" src="assets/icons/notification-plain-v64.png" alt=""><i></i>
    </button>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-route="home"><img src="assets/icons/home.png" alt=""><small>Главная</small></button>
    <button class="nav-item" data-route="search"><img src="assets/icons/search.png" alt=""><small>Поиск</small></button>
    <button class="nav-item" data-route="chats"><img src="assets/icons/chat.png" alt=""><small>Чаты</small></button>
    <button class="nav-item" data-route="favorites"><img src="assets/icons/favorite.png" alt=""><small>Избранное</small></button>
    <button class="nav-item" data-route="profile"><img src="assets/icons/profile.png" alt=""><small>Профиль</small></button>
  </nav>
</div>

<div id="modal" class="modal hidden"></div>

<script src="data/catalog.js?v=67"></script>
<script src="js/app.js?v=67"></script>
</body>
</html>
